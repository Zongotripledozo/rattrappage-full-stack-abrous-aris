services:
  # MongoDB tourne ici comme un "Web Service" Docker (image officielle, pas de build).
  # IMPORTANT : un service gratuit ne peut JAMAIS recevoir de trafic reseau prive (seulement
  # en envoyer) - c'est une limite du plan gratuit de Render, pas une question de config.
  # todo-mongo doit donc etre sur une instance payante pour que todo-backend puisse s'y
  # connecter. Un disque persistant est attache pour que les donnees (comptes, taches)
  # survivent aux redeploiements et redemarrages.
  #
  # IMPORTANT : le nom d'hote interne d'un service Render n'est PAS simplement son "name" -
  # Render y ajoute un suffixe aleatoire propre a chaque service cree (visible sur sa page >
  # bouton "Connect" > onglet "Internal"). Le MONGO_URI ci-dessous utilise le suffixe reel de
  # ce deploiement (todo-mongo-3bdj) ; si le service todo-mongo est un jour recree, ce suffixe
  # changera et il faudra mettre a jour MONGO_URI en consequence.
  - type: web
    name: todo-mongo
    runtime: image
    image:
      url: docker.io/library/mongo:7
    plan: 0.5c-512mb
    disk:
      name: mongo-data
      mountPath: /data/db
      sizeGB: 1
    envVars:
      - key: PORT
        value: 27017

  - type: web
    name: todo-backend
    runtime: docker
    rootDir: Backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        value: mongodb://todo-mongo-3bdj:27017/todo-app
      - key: CLIENT_URL
        sync: false

  - type: web
    name: todo-frontend
    runtime: docker
    rootDir: Frontend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: REACT_APP_API_URL
        sync: false
